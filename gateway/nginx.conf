server {
  listen 80;
  server_name _;

  location / {
    proxy_pass http://frontend:80;
  }
  location /api/auth/ {
    proxy_pass http://auth:8001/;
  }
  location /api/catalog/ {
    proxy_pass http://catalog:8002/;
  }
  location /api/orders/ {
    proxy_pass http://orders:8003/;
  }
  location /api/pay/ {
    proxy_pass http://payments:8004/;
  }
}
