services:
  gateway:
    image: nginx:1.25-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [frontend, auth, catalog, orders, payments]

  frontend:
    build: ./frontend
    depends_on: [auth, catalog, orders]

  auth:
    build: ./services/auth
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: usersdb
      DB_PORT: 5432
    depends_on: [postgres]

  catalog:
    build: ./services/catalog
    environment:
      MONGO_URL: mongodb://mongo:27017/megashop
    depends_on: [mongo]

  orders:
    build: ./services/orders
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ordersdb
      DB_PORT: 5432
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: [postgres, rabbitmq]

  payments:
    build: ./services/payments

  worker:
    build: ./services/worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENTS_URL: http://payments:8004
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      REDIS_URL: redis://redis:6379/0
    depends_on: [rabbitmq, payments, mailhog, redis]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5435:5432"

  mongo:
    image: mongo:7-jammy
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  redis:
    image: redis:7-alpine

volumes:
  pgdata: {}
  mongodata: {}
