apiVersion: v1
kind: Secret
metadata:
  name: megashop-secrets
  namespace: megashop
type: Opaque
stringData:
  POSTGRES_USER: megashop
  POSTGRES_PASSWORD: megashop
  RABBITMQ_USER: megashop
  RABBITMQ_PASSWORD: megashop
  JWT_SECRET: supersecretjwt
  MAILHOG_HOST: mailhog
  MAILHOG_PORT: "1025"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: megashop
spec:
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
  selector: { app: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: megashop
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432, name: pg }]
        envFrom: [{ secretRef: { name: megashop-secrets } }]
        env:
        - { name: POSTGRES_DB, value: "usersdb" }
        - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
        volumeMounts:
        - { name: pgdata, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
  - metadata: { name: pgdata }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: megashop
spec:
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
  selector: { app: mongo }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: megashop
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
      - name: mongo
        image: mongo:7-jammy
        ports: [{ containerPort: 27017, name: mongo }]
        volumeMounts:
        - { name: mongodata, mountPath: /data/db }
  volumeClaimTemplates:
  - metadata: { name: mongodata }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: megashop
spec:
  ports:
  - { name: amqp, port: 5672, targetPort: 5672 }
  - { name: http, port: 15672, targetPort: 15672 }
  selector: { app: rabbitmq }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: megashop
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - { containerPort: 5672, name: amqp }
        - { containerPort: 15672, name: http }
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom: { secretKeyRef: { name: megashop-secrets, key: RABBITMQ_USER } }
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom: { secretKeyRef: { name: megashop-secrets, key: RABBITMQ_PASSWORD } }
        volumeMounts:
        - { name: rmqdata, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
  - metadata: { name: rmqdata }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: megashop }
spec:
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
  selector: { app: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: megashop }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{ containerPort: 6379, name: redis }]
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: megashop
spec:
  ports:
  - { name: smtp, port: 1025, targetPort: 1025 }
  - { name: ui,   port: 8025, targetPort: 8025 }
  selector: { app: mailhog }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: megashop
spec:
  replicas: 1
  selector: { matchLabels: { app: mailhog } }
  template:
    metadata: { labels: { app: mailhog } }
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:v1.0.1
        ports:
        - { containerPort: 1025, name: smtp }
        - { containerPort: 8025, name: ui }
