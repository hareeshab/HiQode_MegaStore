apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels: { app: loki }
spec:
  ports:
  - { name: http, port: 3100, targetPort: http }
  selector: { app: loki }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability
spec:
  serviceName: loki
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.8
        args: [ "-config.file=/etc/loki/config.yml" ]
        ports: [ { containerPort: 3100, name: http } ]
        volumeMounts:
        - { name: loki-data, mountPath: /loki }
        - { name: loki-config, mountPath: /etc/loki }
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata: { name: loki-data }
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2022-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    analytics:
      reporting_enabled: false
