apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
  labels: { app: promtail }
spec:
  selector: { matchLabels: { app: promtail } }
  template:
    metadata: { labels: { app: promtail } }
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:2.9.8
        args: [ "-config.file=/etc/promtail/config.yml" ]
        volumeMounts:
        - { name: varlog, mountPath: /var/log }
        - { name: containers, mountPath: /var/log/containers }
        - { name: pods, mountPath: /var/log/pods }
        - { name: promtail-config, mountPath: /etc/promtail }
      volumes:
      - { name: varlog, hostPath: { path: /var/log } }
      - { name: containers, hostPath: { path: /var/log/containers } }
      - { name: pods, hostPath: { path: /var/log/pods } }
      - { name: promtail-config, configMap: { name: promtail-config } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  config.yml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
    clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
    positions:
      filename: /var/log/positions.yaml
    scrape_configs:
    - job_name: kubernetes-pods
      pipeline_stages:
      - docker: {{}}
      static_configs:
      - targets: [ "localhost" ]
        labels:
          job: kubernetes-pods
          __path__: /var/log/containers/*.log
