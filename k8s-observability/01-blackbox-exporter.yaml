apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: observability
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: "ip4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: observability
  labels: { app: blackbox }
spec:
  replicas: 1
  selector: { matchLabels: { app: blackbox } }
  template:
    metadata: { labels: { app: blackbox } }
    spec:
      containers:
      - name: blackbox
        image: prom/blackbox-exporter:v0.25.0
        args: [ "--config.file=/etc/blackbox/blackbox.yml" ]
        ports: [ { containerPort: 9115, name: http } ]
        volumeMounts:
        - { name: cfg, mountPath: /etc/blackbox }
      volumes:
      - { name: cfg, configMap: { name: blackbox-config, items: [ { key: blackbox.yml, path: blackbox.yml } ] } }
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: observability
  labels: { app: blackbox }
spec:
  ports: [ { name: http, port: 9115, targetPort: http } ]
  selector: { app: blackbox }
