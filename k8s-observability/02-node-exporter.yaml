apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability
  labels: { app: node-exporter }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostPID: true
      hostNetwork: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.1
        args: [ "--path.rootfs=/host" ]
        ports: [ { containerPort: 9100, name: metrics } ]
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
        - { name: rootfs, mountPath: /host, readOnly: true }
      volumes:
      - { name: rootfs, hostPath: { path: /, type: Directory } }
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: observability
  labels: { app: node-exporter }
spec:
  clusterIP: None
  selector: { app: node-exporter }
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
